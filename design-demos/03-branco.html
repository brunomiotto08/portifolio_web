<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Direção 03 · Branco</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
      /* Lógica do vazio de Kenya Hara: a página é a margem.
         A cor vem só das capturas. Sem card, sem pill, sem grade apertada. */
      :root {
        --paper: #f7f6f3;
        --ink: #141414;
        --quiet: #6f6c66;
        --line: #e4e1db;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--paper); color: var(--ink); }
      body {
        font-family: Manrope, ui-sans-serif, sans-serif;
        font-weight: 400;
        font-size: 16px;
        line-height: 1.5;
        text-wrap: pretty;
      }
      a { color: inherit; text-decoration: none; }
      .page { width: min(1120px, calc(100% - 160px)); margin: 0 auto; padding: 32px 0 140px; }
      header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      nav { display: flex; gap: 32px; color: var(--quiet); }
      h1 {
        margin: 10vh 0 0;
        max-width: 9ch;
        font-size: clamp(64px, 8vw, 104px);
        font-weight: 300;
        line-height: 0.92;
        letter-spacing: -0.045em;
      }
      .lede {
        max-width: 36ch;
        margin: 28px 0 0;
        color: var(--quiet);
        font-size: 18px;
        font-weight: 300;
      }
      .work {
        display: grid;
        grid-template-columns: 180px 1fr;
        gap: 48px;
        margin-top: 9vh;
      }
      .meta { padding-top: 8px; }
      .meta p { margin: 0; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
      .meta span { display: block; margin-top: 8px; color: var(--quiet); letter-spacing: 0.04em; }
      img { display: block; width: 100%; height: auto; }
      @media (max-width: 800px) {
        .page { width: calc(100% - 40px); }
        nav { display: none; }
        h1 { margin-top: 10vh; }
        .work { grid-template-columns: 1fr; gap: 16px; margin-top: 10vh; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <a href="#inicio">Bruno Miotto</a>
        <nav>
          <a href="#stellamaris">Trabalhos</a>
          <a href="https://wa.me/5554999252321">Orçamento</a>
        </nav>
      </header>
      <main id="inicio">
        <h1>Portfólio de websites</h1>
        <p class="lede">Sites institucionais, landing pages e experiências web em produção.</p>
        <article class="work" id="stellamaris">
          <div class="meta">
            <p>Stellamaris</p>
            <span>2026</span>
          </div>
          <img src="../public/assets/portfolio/stellamaris-website/page-01.webp" alt="Hero Stellamaris Cidadania" />
        </article>
      </main>
    </div>
  </body>
</html>
