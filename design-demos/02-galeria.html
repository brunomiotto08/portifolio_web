<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Direção 02 · Galeria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Referência: Glass (glass.photo). A foto ocupa o palco.
         A interface só assina o nome, o ano e a saída. */
      :root {
        --void: #070707;
        --paper: #f3f1ec;
        --quiet: #8d8d8d;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--void); color: var(--paper); }
      body {
        font-family: Inter, ui-sans-serif, sans-serif;
        font-size: 15px;
        text-wrap: pretty;
      }
      a { color: inherit; text-decoration: none; }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: min(1280px, calc(100% - 96px));
        margin: 0 auto;
        padding: 28px 0;
      }
      .brand, .ask, nav a {
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      nav { display: flex; gap: 28px; color: var(--quiet); }
      .ask { color: var(--paper); border-bottom: 1px solid var(--paper); padding-bottom: 2px; }
      .plate {
        width: min(1040px, calc(100% - 160px));
        margin: 8vh auto 18vh;
      }
      img {
        display: block;
        width: 100%;
        height: auto;
      }
      figcaption {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        margin-top: 22px;
      }
      h2 {
        margin: 0;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 32px;
        font-weight: 500;
        letter-spacing: 0.01em;
      }
      p { margin: 6px 0 0; color: var(--quiet); font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; }
      @media (max-width: 800px) {
        header, .plate { width: calc(100% - 40px); }
        nav { display: none; }
        .plate { margin-top: 4vh; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="#inicio">Bruno Miotto</a>
      <nav>
        <a href="#stellamaris">Trabalhos</a>
        <a href="#contato">Contato</a>
      </nav>
      <a class="ask" href="https://wa.me/5554999252321">Orçamento</a>
    </header>
    <main id="inicio">
      <figure class="plate" id="stellamaris">
        <img src="../public/assets/portfolio/stellamaris-website/page-01.webp" alt="Hero Stellamaris Cidadania" />
        <figcaption>
          <div>
            <h2>Stellamaris Cidadania</h2>
            <p>Jurídico · 2026</p>
          </div>
          <p>01 / 04</p>
        </figcaption>
      </figure>
      <figure class="plate" id="nelci">
        <img src="../public/assets/portfolio/nelci-website/page-01.png" alt="Hero Nelci Advocacia" />
        <figcaption>
          <div>
            <h2>Nelci Advocacia</h2>
            <p>Jurídico · 2026</p>
          </div>
          <p>02 / 04</p>
        </figcaption>
      </figure>
    </main>
  </body>
</html>
